services:
  - type: web
    name: pmc-internet-live
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22.0.0"
      - key: DATA_DIR
        value: /var/data
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_MOBILE
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM
        sync: false
      - key: SHOW_DEMO_OTP
        value: "false"
    disk:
      name: pmc-data
      mountPath: /var/data
      sizeGB: 1
