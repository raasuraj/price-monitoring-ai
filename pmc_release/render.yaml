services:
  - type: web
    name: pmc-internet-live
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_MOBILE
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM
        sync: false
      - key: SHOW_DEMO_OTP
        value: "false"
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        value: gpt-5.6-luna
      - key: AI_BASE_URL
        value: https://api.openai.com/v1/responses
    disk:
      name: pmc-data
      mountPath: /var/data
      sizeGB: 1
